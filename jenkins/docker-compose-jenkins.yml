services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: iudigital-jenkins-cd
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - iudigital-jenkins-net

volumes:
  jenkins_home:

networks:
  iudigital-jenkins-net:
    name: iudigital-jenkins-net
    driver: bridge