services:
  mongo-desacoplado:
    image: mongo:7.0
    container_name: iudigital-mongo-desacoplado
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: iudigital_desacoplado
    volumes:
      - mongo_desacoplado_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iudigital-net

  servicio-catalogos:
    build:
      context: ../backend-desacoplado/servicio-catalogos
      dockerfile: Dockerfile
    container_name: iudigital-servicio-catalogos
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      MONGO_URI: mongodb://mongo-desacoplado:27017/iudigital_catalogos
    depends_on:
      mongo-desacoplado:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - iudigital-net

  servicio-proyectos:
    build:
      context: ../backend-desacoplado/servicio-proyectos
      dockerfile: Dockerfile
    container_name: iudigital-servicio-proyectos
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      MONGO_URI: mongodb://mongo-desacoplado:27017/iudigital_proyectos
      CATALOGOS_SERVICE_URL: http://servicio-catalogos:4001
      CATALOGOS_TIMEOUT_MS: 3000
    depends_on:
      mongo-desacoplado:
        condition: service_healthy
      servicio-catalogos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - iudigital-net

volumes:
  mongo_desacoplado_data:

networks:
  iudigital-net:
    name: iudigital-net
    driver: bridge