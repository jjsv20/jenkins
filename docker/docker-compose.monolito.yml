services:
  mongo-monolito:
    image: mongo:7.0
    container_name: iudigital-mongo-monolito
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: iudigital_asesorias_monolito
    volumes:
      - mongo_monolito_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iudigital-net

  monolito-app:
    build:
      context: ../backend-monolito
      dockerfile: Dockerfile
    container_name: iudigital-monolito-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo-monolito:27017/iudigital_asesorias_monolito
    depends_on:
      mongo-monolito:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - iudigital-net

volumes:
  mongo_monolito_data:

networks:
  iudigital-net:
    name: iudigital-net
    driver: bridge